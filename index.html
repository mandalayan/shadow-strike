<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadow Strike — 2D Fighter</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header><div><p class="eyebrow">LOCAL MULTIPLAYER · 2D ARENA</p><h1>SHADOW <span>STRIKE</span></h1></div><button id="reset">RESTART MATCH ↻</button></header>
  <section class="hud">
    <div class="fighter"><label>PLAYER 1 <small>BLUE</small></label><div class="bar"><i id="hp1"></i></div></div>
    <div class="clock" id="clock">99</div>
    <div class="fighter right"><label>PLAYER 2 <small>RED</small></label><div class="bar"><i id="hp2"></i></div></div>
  </section>
  <canvas id="arena" width="960" height="520" aria-label="Shadow Strike fighting arena"></canvas>
  <div class="controls">
    <div><b>PLAYER 1</b><p><kbd>A</kbd><kbd>D</kbd> Move · <kbd>W</kbd> Jump</p><p><kbd>F</kbd> Punch · <kbd>G</kbd> Kick · <kbd>H</kbd> Block</p></div>
    <div><b>PLAYER 2</b><p><kbd>←</kbd><kbd>→</kbd> Move · <kbd>↑</kbd> Jump</p><p><kbd>K</kbd> Punch · <kbd>L</kbd> Kick · <kbd>;</kbd> Block</p></div>
  </div>
  <p id="status" class="status">FIGHT! First to empty the opponent's health bar wins.</p>
  <footer>Built with HTML Canvas + vanilla JavaScript. Two players, one keyboard.</footer>
</main><script src="game.js"></script>
</body></html>

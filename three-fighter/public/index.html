<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shadow Strike — 3D Arena</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="overlay"><header><div class="brand">SHADOW <b>STRIKE</b><small>3D ARENA · ONLINE DUEL</small></div><div id="status">Create a room or join a friend</div></header>
<section id="lobby"><input id="name" maxlength="18" placeholder="Fighter name" value="Fighter"><button id="create">CREATE ROOM</button><div class="join"><input id="roomCode" maxlength="6" placeholder="ROOM CODE"><button id="join">JOIN ROOM</button></div><p id="message">Share your room code with one other player.</p></section>
<section id="hud" hidden><div class="fighter"><span id="you">YOU</span><div class="bar"><i id="hp1"></i></div></div><div id="timer">FIGHT</div><div class="fighter right"><span id="enemy">OPPONENT</span><div class="bar"><i id="hp2"></i></div></div></section>
<footer><span>WASD / ARROWS MOVE · SPACE JUMP</span><span>J PUNCH · K KICK · L BLOCK</span></footer></div><div id="result" hidden></div>
<script src="/socket.io/socket.io.js"></script><script type="module" src="/game.js"></script></body></html>
